name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ 不用 android-actions/setup-android@v3：它执行的 `sdkmanager tools` 在新版
      #    cmdline-tools(16.0) 里已不存在，会直接失败。改为手动接受许可 + 补齐 platform。
      - name: Android SDK licenses and platform
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      # 临时诊断：确认 runner 侧各仓库对 KSP 插件标记构件的真实返回码
      - name: Diagnose KSP plugin marker
        run: |
          for repo in "https://maven.aliyun.com/repository/gradle-plugin" "https://maven.aliyun.com/repository/google" "https://maven.aliyun.com/repository/public" "https://dl.google.com/dl/android/maven2" "https://repo1.maven.org/maven2" "https://plugins.gradle.org/m2"; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' -m 20 "$repo/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom")
            echo "$repo => $code"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 构建新鲜度标记：产物里带 commit SHA，用于验证「构建缓存导致代码不更新」
      - name: Marker
        run: echo "Building commit $(git rev-parse --short HEAD)"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore